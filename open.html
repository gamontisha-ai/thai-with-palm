<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Opening Thai with Palm…</title>
<style>
  :root{ --coral:#FF6B5C; --coral-d:#E7503F; --teal:#12A79E; --teal-d:#0E877F; --ink:#3A3340; --soft:#716A78; --bg:#FFF8F2; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:"Nunito","Segoe UI",sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ max-width:400px; width:100%; text-align:center; background:#fff; border-radius:24px;
    box-shadow:0 10px 26px rgba(150,120,100,.18); padding:34px 26px; }
  .flag{ font-size:44px; margin-bottom:6px; }
  h1{ font-size:21px; margin:6px 0 4px; color:var(--coral-d); }
  p{ color:var(--soft); font-size:14.5px; line-height:1.6; margin:6px 0 22px; }
  .spinner{ width:34px; height:34px; border:4px solid #ffe0d6; border-top-color:var(--coral); border-radius:50%;
    margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .btn{ display:block; width:100%; text-decoration:none; border:none; cursor:pointer; border-radius:16px;
    padding:15px; font-weight:800; font-size:16px; margin-top:10px; font-family:inherit; }
  .btn-primary{ background:linear-gradient(135deg,var(--teal),var(--teal-d)); color:#fff; }
  .btn-secondary{ background:#fff; color:var(--ink); border:2px solid #eee; }
  .note{ font-size:12.5px; color:var(--soft); margin-top:16px; line-height:1.6; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="flag">🇹🇭</div>
  <h1>Thai with Palm</h1>

  <div id="autoState">
    <div class="spinner"></div>
    <p>Opening in Chrome for the best experience…</p>
  </div>

  <div id="manualState" class="hidden">
    <p>Tap below to open in Chrome — this gives the best voice quality.</p>
    <a class="btn btn-primary" id="chromeBtn">🌐 Open in Chrome</a>
    <a class="btn btn-secondary" id="anyBtn" href="https://learn-thai-with-palm.netlify.app/">Continue in this browser instead</a>
    <p class="note">If "Open in Chrome" doesn't work, make sure the free Chrome app is installed from your app store, then try again.</p>
  </div>
</div>

<script>
const APP_URL = "https://learn-thai-with-palm.netlify.app/";
const BARE_URL = APP_URL.replace(/^https?:\/\//, "");

const ua = navigator.userAgent || "";
const isAndroid = /Android/i.test(ua);
const isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;
const isAlreadyChrome = /CriOS|Chrome/i.test(ua) && !/Line|FBAN|FBAV|Instagram/i.test(ua);

function showManual(){
  document.getElementById("autoState").classList.add("hidden");
  document.getElementById("manualState").classList.remove("hidden");
}

if(isAlreadyChrome){
  // already in Chrome (or a Chromium-based browser) — just go straight in, no extra step needed
  location.href = APP_URL;
} else if(isAndroid){
  // Android supports a real forced-open-in-Chrome intent; if Chrome isn't
  // installed, Android itself falls back to showing the Play Store or the
  // normal browser, so this is safe to fire automatically
  const intentUrl = "intent://" + BARE_URL + "#Intent;scheme=https;package=com.android.chrome;end;";
  location.href = intentUrl;
  setTimeout(showManual, 1200); // in case nothing happened (Chrome missing, etc.)
  document.getElementById("chromeBtn").href = intentUrl;
} else if(isIOS){
  // iOS has no automatic redirect Apple allows — show the one-tap button right away
  document.getElementById("chromeBtn").href = "googlechromes://" + BARE_URL;
  showManual();
} else {
  // desktop or anything else — just continue normally
  location.href = APP_URL;
}
</script>
</body>
</html>
